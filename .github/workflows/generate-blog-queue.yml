name: Generate Blog Queue (Weekly)

# Runs every Monday at 10:00 UTC (6 AM Santiago).
# Generates ~20 posts (2/day cadence matches the publish workflow below).
# Requires the ANTHROPIC_API_KEY repo secret — see the "Check API key" step;
# if it's missing this workflow skips gracefully instead of hard-failing the
# scheduled run.

on:
  schedule:
    - cron: '0 10 * * 1'
  workflow_dispatch:
    inputs:
      count:
        description: 'Number of posts to generate'
        default: '20'
        required: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # FAIL, don't skip.
      #
      # This step used to emit a ::warning:: and set has_key=false, which made
      # the two steps below `if:`-skip while the job still reported SUCCESS.
      # The secret was never added, so that is exactly what happened every
      # Monday from 2026-07-27 to 2026-09-14: nine consecutive green runs,
      # 15-20 seconds each, generating nothing. The queue sat at 0 and
      # realiracing.com published nothing for seven weeks with no red run
      # anywhere to say so.
      #
      # A missing secret is a broken pipeline, not a quiet week. deploy.yml in
      # this same repo already gets this right for the FTP secrets — ::error::
      # and exit 1 — and the monorepo's golferos generator says it outright:
      # "Without it the job fails loudly rather than shipping nothing quietly."
      - name: Require API key
        run: |
          if [ -z "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            echo "::error::ANTHROPIC_API_KEY is not set, so this run cannot generate anything. Add it under Settings > Secrets and variables > Actions. This now fails instead of passing silently — nine scheduled runs reported success while doing nothing."
            exit 1
          fi
          echo "✓ key present"

      - name: Generate posts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          COUNT="${{ github.event.inputs.count || '20' }}"
          node _deploy/generate-post-queue.js --count "$COUNT"

      - name: Commit new posts
        run: |
          git config user.name "RealIRacing Blog Bot"
          git config user.email "bot@realiracing.com"
          git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"
          git add _deploy/posts-queue/
          git diff --cached --quiet && echo "Nothing new to commit" && exit 0
          git commit -m "chore: auto-generate $(git diff --cached --name-only | wc -l | tr -d ' ') blog posts for queue"
          # Retry push with rebase --autostash for concurrent push + unstaged residuals
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase --autostash origin/main; then
              if git push origin HEAD:main; then
                echo "Pushed on attempt $attempt"
                exit 0
              fi
            else
              git rebase --abort 2>/dev/null || true
            fi
            echo "Push attempt $attempt failed — retrying after $((attempt * 5))s"
            sleep $((attempt * 5))
          done
          echo "::error::Failed to push after 5 attempts"
          exit 1
